services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acts
      POSTGRES_DB: acts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5710}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acts"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["prod"]
    build:
      context: .
      target: builder
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgres://acts:${POSTGRES_PASSWORD}@db:5432/acts
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    profiles: ["prod"]
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://acts:${POSTGRES_PASSWORD}@db:5432/acts
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PAYROLL_ENCRYPTION_KEY: ${PAYROLL_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3710}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  cloudflared:
    profiles: ["prod"]
    image: cloudflare/cloudflared:2025.11.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
